{% set name = "azure-mgmt-batch" %}
{% set version = "17.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fc94881a6acdb8a9533f371b6f7b2d3eaea1789eb955014b24a908d6dfe75991

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<37]

requirements:
  host:
    - python
    - setuptools
    - pip
    - wheel
  run:
    - python
    - isodate >=0.6.1,<1.0.0
    - azure-common >=1.1,<2
    - azure-mgmt-core >=1.3.2,<2.0.0
    - typing-extensions>=4.3.0  # [py<38]

test:
  imports:
    - azure.mgmt
    - azure.mgmt.batch
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Azure/azure-sdk-for-python
  summary: Microsoft Azure Batch Management Client Library for Python
  license: MIT
  license_file: LICENSE.txt
  license_family: MIT
  description: Microsoft Azure Batch Management Client Library for Python
  dev_url: https://github.com/Azure/azure-sdk-for-python
  doc_url: https://github.com/Azure/azure-sdk-for-python

extra:
  recipe-maintainers:
    - johanneskoester
    - janjagusch
